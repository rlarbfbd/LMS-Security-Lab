{% extends "base.html" %}

{% block title %}
공지사항

{% block content %}

<h2>공지사항</h2>


{% for notice in notices %}

<div class="card">

    <h3>
        {{ notice.title }}
    </h3>

    <p>
        {{ notice.content }}
    </p>

    <small>
        {{ notice.created_at }}
    </small>

</div>

{% endfor %}

{% endblock %}
