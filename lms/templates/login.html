<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LMS 로그인</title>
</head>

<body>

    <h1>LMS</h1>

    <form method="POST" action="/login">

        <div>
            <label>아이디</label>
            <input type="text" name="username">
        </div>

        <div>
            <label>비밀번호</label>
            <input type="password" name="password">
        </div>

        <button type="submit">
            로그인
        </button>

    </form>

</body>
</html>
